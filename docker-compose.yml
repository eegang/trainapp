services:
  bot:
    build: .
    container_name: trainapp-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Базу пишем в volume (/app/data), а не в образ — данные не теряются при деплое.
      DB_PATH: /app/data/training_bot.db
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
